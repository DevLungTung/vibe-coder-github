<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO App - Vibe Coder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    .subtitle {
      opacity: 0.9;
      font-size: 0.9em;
    }
    
    .add-todo {
      padding: 20px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    .todos {
      padding: 20px;
    }
    
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    
    .todo-item:hover {
      background: #f8f8f8;
    }
    
    .todo-item.done .todo-text {
      text-decoration: line-through;
      opacity: 0.5;
    }
    
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    
    .todo-text {
      flex: 1;
      font-size: 1.05em;
    }
    
    .delete-btn {
      padding: 8px 16px;
      background: #ef4444;
      font-size: 0.9em;
    }
    
    .delete-btn:hover {
      background: #dc2626;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 TODO App</h1>
      <p class="subtitle">Built by vibe coders with Git & GitHub</p>
    </header>
    
    <div class="add-todo">
      <div class="input-group">
        <input 
          type="text" 
          id="todoInput" 
          placeholder="Nhập công việc mới..." 
          autocomplete="off"
        />
        <button onclick="addTodo()">Thêm</button>
      </div>
    </div>
    
    <div class="todos" id="todoList"></div>
    
    <div class="footer">
      Made with ❤️ by Quân IT
    </div>
  </div>

  <script>
    const API_URL = '/api/todos';

    async function loadTodos() {
      try {
        const response = await fetch(API_URL);
        const todos = await response.json();
        renderTodos(todos);
      } catch (error) {
        console.error('Failed to load todos:', error);
      }
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty-state">Chưa có công việc nào. Hãy thêm mới!</div>';
        return;
      }
      
      list.innerHTML = todos.map(todo => `
        <div class="todo-item ${todo.done ? 'done' : ''}">
          <input 
            type="checkbox" 
            ${todo.done ? 'checked' : ''} 
            onchange="toggleTodo(${todo.id}, this.checked)"
          />
          <span class="todo-text">${escapeHtml(todo.title)}</span>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">Xóa</button>
        </div>
      `).join('');
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const title = input.value.trim();
      
      if (!title) return;
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        
        if (response.ok) {
          input.value = '';
          loadTodos();
        }
      } catch (error) {
        console.error('Failed to add todo:', error);
      }
    }

    async function toggleTodo(id, done) {
      try {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done })
        });
        loadTodos();
      } catch (error) {
        console.error('Failed to update todo:', error);
      }
    }

    async function deleteTodo(id) {
      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadTodos();
      } catch (error) {
        console.error('Failed to delete todo:', error);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('todoInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    loadTodos();
  </script>
</body>
</html>
