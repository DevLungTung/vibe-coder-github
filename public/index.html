<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO App - Vibe Coder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    .subtitle {
      opacity: 0.9;
      font-size: 0.9em;
    }
    
    .add-todo {
      padding: 20px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
    }
    
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    .todos {
      padding: 20px;
    }
    
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    
    .todo-item:hover {
      background: #f8f8f8;
    }
    
    .todo-item.done .todo-text {
      text-decoration: line-through;
      opacity: 0.5;
    }
    
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    
    .todo-text {
      flex: 1;
      font-size: 1.05em;
    }
    
    .delete-btn {
      padding: 8px 16px;
      background: #ef4444;
      font-size: 0.9em;
    }
    
    .delete-btn:hover {
      background: #dc2626;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 0.9em;
    }

    [hidden] {
      display: none !important;
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #f8f8ff;
      border-bottom: 2px solid #f0f0f0;
      font-size: 0.95em;
      color: #444;
    }

    .logout-btn {
      padding: 6px 14px;
      font-size: 0.9em;
      background: #6b7280;
    }

    .logout-btn:hover {
      background: #4b5563;
    }

    .auth {
      padding: 30px;
    }

    .auth h2 {
      font-size: 1.3em;
      margin-bottom: 16px;
      color: #333;
    }

    .auth form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9em;
      color: #555;
    }

    input[type="password"] {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .auth-error {
      color: #dc2626;
      font-size: 0.9em;
      min-height: 1.2em;
    }

    .auth-switch {
      margin-top: 16px;
      font-size: 0.9em;
      color: #666;
      text-align: center;
    }

    .link-btn {
      padding: 0;
      background: none;
      color: #667eea;
      font-weight: 600;
      font-size: 1em;
      text-decoration: underline;
    }

    .link-btn:hover {
      background: none;
      color: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 TODO App</h1>
      <p class="subtitle">Built by vibe coders, one commit at a time</p>
    </header>

    <section class="auth" id="authView" hidden>
      <h2 id="authTitle">Log in</h2>
      <form id="authForm">
        <label>
          Username
          <input type="text" id="usernameInput" autocomplete="username" required />
        </label>
        <label>
          Password
          <input type="password" id="passwordInput" autocomplete="current-password" required />
        </label>
        <div class="auth-error" id="authError" role="alert"></div>
        <button type="submit" id="authSubmit">Log in</button>
      </form>
      <p class="auth-switch">
        <span id="authSwitchText">Don't have an account?</span>
        <button type="button" class="link-btn" id="authSwitch">Sign up</button>
      </p>
    </section>

    <div id="todoView" hidden>
    <div class="user-bar">
      <span>Logged in as <strong id="currentUser"></strong></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>

    <div class="add-todo">
      <div class="input-group">
        <input 
          type="text" 
          id="todoInput" 
          placeholder="Nhập công việc mới..." 
          autocomplete="off"
        />
        <button onclick="addTodo()">Thêm</button>
      </div>
    </div>
    
    <div class="todos" id="todoList"></div>
    </div>

    <div class="footer">
      Made with ❤️ by Quân IT
    </div>
  </div>

  <script>
    const API_URL = '/api/todos';
    const TOKEN_KEY = 'todoAuthToken';
    let authMode = 'login'; // 'login' or 'register'

    function getToken() {
      try {
        return localStorage.getItem(TOKEN_KEY);
      } catch {
        return null;
      }
    }

    function setToken(token) {
      try {
        if (token) {
          localStorage.setItem(TOKEN_KEY, token);
        } else {
          localStorage.removeItem(TOKEN_KEY);
        }
      } catch {
        // Storage unavailable (e.g. private mode); stay logged in for this page only.
      }
      currentToken = token;
    }

    let currentToken = getToken();

    // fetch() wrapper that sends the login token and logs out on 401.
    async function apiFetch(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (currentToken) {
        headers.Authorization = `Bearer ${currentToken}`;
      }
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        logout();
        throw new Error('Not authenticated');
      }
      return response;
    }

    function showAuthView() {
      document.getElementById('todoView').hidden = true;
      document.getElementById('authView').hidden = false;
      document.getElementById('usernameInput').focus();
    }

    function showTodoView(username) {
      document.getElementById('authView').hidden = true;
      document.getElementById('todoView').hidden = false;
      document.getElementById('currentUser').textContent = username;
      loadTodos();
    }

    function setAuthMode(mode) {
      authMode = mode;
      const isLogin = mode === 'login';
      document.getElementById('authTitle').textContent = isLogin ? 'Log in' : 'Create an account';
      document.getElementById('authSubmit').textContent = isLogin ? 'Log in' : 'Sign up';
      document.getElementById('authSwitchText').textContent = isLogin
        ? 'Don\'t have an account?'
        : 'Already have an account?';
      document.getElementById('authSwitch').textContent = isLogin ? 'Sign up' : 'Log in';
      document.getElementById('passwordInput').autocomplete = isLogin ? 'current-password' : 'new-password';
      document.getElementById('authError').textContent = '';
    }

    async function submitAuth(event) {
      event.preventDefault();
      const errorEl = document.getElementById('authError');
      const submitBtn = document.getElementById('authSubmit');
      errorEl.textContent = '';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`/api/auth/${authMode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('usernameInput').value,
            password: document.getElementById('passwordInput').value
          })
        });
        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = data.error || 'Something went wrong';
          return;
        }

        setToken(data.token);
        document.getElementById('authForm').reset();
        showTodoView(data.user.username);
      } catch (error) {
        errorEl.textContent = 'Could not reach the server';
      } finally {
        submitBtn.disabled = false;
      }
    }

    function logout() {
      setToken(null);
      document.getElementById('todoList').innerHTML = '';
      setAuthMode('login');
      showAuthView();
    }

    async function init() {
      if (!currentToken) {
        showAuthView();
        return;
      }
      try {
        const response = await apiFetch('/api/auth/me');
        const { user } = await response.json();
        showTodoView(user.username);
      } catch (error) {
        // apiFetch already showed the login form on 401.
        if (!document.getElementById('authView').hidden) {
          return;
        }
        showAuthView();
      }
    }

    async function loadTodos() {
      try {
        const response = await apiFetch(API_URL);
        const todos = await response.json();
        renderTodos(todos);
      } catch (error) {
        console.error('Failed to load todos:', error);
      }
    }

    function renderTodos(todos) {
      const list = document.getElementById('todoList');
      
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty-state">Chưa có công việc nào. Hãy thêm mới!</div>';
        return;
      }
      
      list.innerHTML = todos.map(todo => `
        <div class="todo-item ${todo.done ? 'done' : ''}">
          <input 
            type="checkbox" 
            ${todo.done ? 'checked' : ''} 
            onchange="toggleTodo(${todo.id}, this.checked)"
          />
          <span class="todo-text">${escapeHtml(todo.title)}</span>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">Xóa</button>
        </div>
      `).join('');
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const title = input.value.trim();
      
      if (!title) return;
      
      try {
        const response = await apiFetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        
        if (response.ok) {
          input.value = '';
          loadTodos();
        }
      } catch (error) {
        console.error('Failed to add todo:', error);
      }
    }

    async function toggleTodo(id, done) {
      try {
        await apiFetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done })
        });
        loadTodos();
      } catch (error) {
        console.error('Failed to update todo:', error);
      }
    }

    async function deleteTodo(id) {
      try {
        await apiFetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadTodos();
      } catch (error) {
        console.error('Failed to delete todo:', error);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('todoInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('authForm').addEventListener('submit', submitAuth);
    document.getElementById('authSwitch').addEventListener('click', () => {
      setAuthMode(authMode === 'login' ? 'register' : 'login');
    });
    document.getElementById('logoutBtn').addEventListener('click', logout);

    init();
  </script>
</body>
</html>
